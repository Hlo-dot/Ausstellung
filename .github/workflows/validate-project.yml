name: Projektvalidierung

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Werk- und Ausstellungsdaten prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relevante Änderungen erkennen
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^(works\.json|exhibitions\.json|main\.js|audio/|pdf/|artstrips/|scripts/validate_project\.py|tests/|\.github/workflows/validate-project\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regressionstests ausführen
        if: steps.changes.outputs.relevant == 'true'
        run: python3 -m unittest discover -s tests -v

      - name: Projektbestand validieren
        if: steps.changes.outputs.relevant == 'true'
        run: python3 scripts/validate_project.py

      - name: Keine Werkprüfung erforderlich
        if: steps.changes.outputs.relevant != 'true'
        run: echo "Nur nicht werkrelevante Dateien geändert; Pflichtcheck erfüllt."
