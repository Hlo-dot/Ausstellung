name: Projektvalidierung

on:
  pull_request:
    paths:
      - "works.json"
      - "exhibitions.json"
      - "main.js"
      - "audio/**"
      - "pdf/**"
      - "artstrips/**"
      - "scripts/validate_project.py"
      - "tests/**"
      - ".github/workflows/validate-project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Werk- und Ausstellungsdaten prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Regressionstests ausführen
        run: python3 -m unittest discover -s tests -v

      - name: Projektbestand validieren
        run: python3 scripts/validate_project.py
