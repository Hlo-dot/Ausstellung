name: Artstrip Zwischen Traum und Tür erzeugen

on:
  push:
    branches:
      - fix/artstrip-ztut
    paths:
      - scripts/build_artstrip_from_pdf.py
      - .github/workflows/build-artstrip-ztut.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: fix/artstrip-ztut

      - name: Abhängigkeiten bereitstellen
        run: |
          command -v pdfimages >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python3 -m pip install --disable-pip-version-check pillow

      - name: Artstrip erzeugen
        run: |
          python3 scripts/build_artstrip_from_pdf.py \
            --pdf "pdf/PDF_Flu_Ulf_Obermann_Loewenstein_Grenzzeit_Zwischen_Traum_und_Tuer_2025_3x_20x100cm.pdf" \
            --output "artstrips/ZTUT-horizontal.jpg" \
            --width 1200 \
            --height 160 \
            --focus-y 0.573

      - name: ZTUT aus Altbeständen entfernen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/validate_artstrips.py")
          text = path.read_text(encoding="utf-8")
          old = '    "ztut",\n'
          if old not in text:
              raise SystemExit("ZTUT-Ausnahme wurde nicht gefunden.")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artstrips/ZTUT-horizontal.jpg scripts/validate_artstrips.py
          if git diff --cached --quiet; then
            echo "Keine Änderung erforderlich."
            exit 0
          fi
          git commit -m "Artstrip Zwischen Traum und Tür ersetzen"
          git push origin HEAD:fix/artstrip-ztut
