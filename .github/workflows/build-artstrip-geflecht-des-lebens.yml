name: Artstrip Geflecht des Lebens erzeugen

on:
  push:
    branches:
      - fix/artstrip-geflecht-des-lebens
    paths:
      - .github/workflows/build-artstrip-geflecht-des-lebens.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: fix/artstrip-geflecht-des-lebens

      - name: Abhängigkeiten bereitstellen
        run: |
          command -v pdfimages >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python3 -m pip install --disable-pip-version-check pillow

      - name: Artstrip erzeugen
        run: |
          python3 scripts/build_artstrip_from_pdf.py \
            --pdf "pdf/Geflecht_des_Lebens.pdf" \
            --output "artstrips/Geflecht-des-Lebens-horizontal.jpg" \
            --width 1200 \
            --height 160 \
            --focus-y 0.50

      - name: Geflecht des Lebens aus Altbeständen entfernen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/validate_artstrips.py")
          text = path.read_text(encoding="utf-8")
          old = '    "geflecht-des-lebens",\n'
          if old not in text:
              raise SystemExit("Geflecht-des-Lebens-Ausnahme wurde nicht gefunden.")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artstrips/Geflecht-des-Lebens-horizontal.jpg scripts/validate_artstrips.py
          if git diff --cached --quiet; then
            echo "Keine Änderung erforderlich."
            exit 0
          fi
          git commit -m "Artstrip Geflecht des Lebens ersetzen"
          git push origin HEAD:fix/artstrip-geflecht-des-lebens
