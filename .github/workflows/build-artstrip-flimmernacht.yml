name: Artstrip Flimmernacht korrigieren

on:
  push:
    branches:
      - fix-flimmernacht-artstrip
    paths:
      - .github/workflows/build-artstrip-flimmernacht.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: fix-flimmernacht-artstrip

      - name: Abhängigkeiten bereitstellen
        run: |
          command -v pdfimages >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python3 -m pip install --disable-pip-version-check pillow

      - name: Original-PDF verifizieren
        run: |
          test "$(git hash-object pdf/Flimmernacht.pdf)" = "56dc434906e3d3dc034cea22ef52cd0c76a68d9f"
          test "$(stat -c%s pdf/Flimmernacht.pdf)" = "151452"

      - name: Artstrip aus dem Werkmotiv erzeugen
        run: |
          python3 scripts/build_artstrip_from_pdf.py \
            --pdf "pdf/Flimmernacht.pdf" \
            --output "artstrips/Flimmernacht-horizontal.jpg" \
            --width 1275 \
            --height 185 \
            --focus-y 0.529

      - name: Ergebnis prüfen
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('artstrips/Flimmernacht-horizontal.jpg')
          with Image.open(p) as im:
              assert im.size == (1275, 185), im.size
          assert p.stat().st_size > 10000, p.stat().st_size
          PY

      - name: Einmaligen Workflow entfernen und Ergebnis committen
        run: |
          rm .github/workflows/build-artstrip-flimmernacht.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artstrips/Flimmernacht-horizontal.jpg .github/workflows/build-artstrip-flimmernacht.yml
          git commit -m "Correct Flimmernacht artstrip from original PDF"
          git push origin HEAD:fix-flimmernacht-artstrip
