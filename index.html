<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light only" />
  <meta name="theme-color" content="#efede7" />
  <title>Ausstellung – Werk</title>
  <link rel="preload" href="/style.css" as="style" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/logo.jpg" />
  <script>
    (function normalizeWorkPath() {
      const id = new URLSearchParams(location.search).get("id");
      if (id && location.pathname === "/") {
        history.replaceState(null, "", "/work/" + encodeURIComponent(id));
      }
    })();
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main class="page" aria-live="polite">
    <article class="wrap" data-theme="neutral">
      <header class="site-header">
        <img src="/logo.jpg" alt="FLU – New Fine Art" class="top-logo" />
        <div class="exhibition-meta">
          <p class="kicker">Digitale Werkbegleitung</p>
          <p id="venue" class="venue">Ausstellungsort</p>
          <p id="exhibition" class="exhibition">Ausstellungstitel</p>
          <p id="sub" class="sub">Datum</p>
        </div>
      </header>

      <figure id="art-strip" class="art-strip" aria-hidden="true" hidden>
        <img id="art-strip-image" alt="" />
      </figure>

      <section class="work-summary" aria-labelledby="work-title">
        <p id="work-meta" class="work-meta"></p>
        <h1 id="work-title">Werk</h1>
        <p id="work-details" class="work-details" hidden></p>
      </section>

      <div class="actions">
        <button class="primary-action" id="btn-audio" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-4a8 8 0 0 1 16 0v4"/><path d="M4 14a3 3 0 0 0 3 3h1v-6H7a3 3 0 0 0-3 3Zm16 0a3 3 0 0 1-3 3h-1v-6h1a3 3 0 0 1 3 3Z"/></svg>
          <span class="action-copy"><strong id="audio-title">Audiobeschreibung</strong><small id="audio-subtitle">Das Werk hören</small></span>
          <span class="action-arrow" id="audio-action-icon" aria-hidden="true">▶</span>
          <span class="sr-only" id="audio-live" aria-live="polite"></span>
        </button>

        <div class="secondary-actions">
          <button class="text-action" id="btn-pdf" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg>
            <span id="pdf-label">Werktext lesen</span><span class="action-arrow" aria-hidden="true">→</span>
          </button>
          <button class="text-action" id="btn-video" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5z"/><circle cx="12" cy="12" r="10"/></svg>
            <span>Arbeitsweise ansehen</span><span class="action-arrow" aria-hidden="true">→</span>
          </button>
          <button class="text-action" id="btn-artist" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
            <span>Über den Künstler</span><span class="action-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </div>

      <p class="hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-4a8 8 0 0 1 16 0v4"/><path d="M4 14a3 3 0 0 0 3 3h1v-6H7a3 3 0 0 0-3 3Zm16 0a3 3 0 0 1-3 3h-1v-6h1a3 3 0 0 1 3 3Z"/></svg>
        <span>Am besten mit Kopfhörern. Ohne Kopfhörer bitte so leise, dass andere Besucher nicht gestört werden.</span>
      </p>

      <footer class="footer">
        <a class="footer-credit" href="https://www.flu.ruhr" target="_blank" rel="noopener">
          © <span id="copyright-year">2026</span> FLU · Ulf Obermann-Löwenstein
        </a>
        <nav class="footer-links" aria-label="Rechtliche Informationen">
          <a href="https://www.flu.ruhr/impressum" target="_blank" rel="noopener">Impressum</a>
          <span aria-hidden="true">·</span>
          <a href="https://www.flu.ruhr/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
        </nav>
      </footer>
    </article>
  </main>

  <div id="modal" class="modal">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dialog-hd">
        <div id="dlg-title" class="dialog-ttl">Titel</div>
        <div class="dialog-actions">
          <button class="modal-btn" id="dlg-open-new" type="button">Extern öffnen</button>
          <button class="modal-btn" id="dlg-close" type="button" aria-label="Dialog schließen">Schließen</button>
        </div>
      </div>
      <div id="dlg-body" class="dialog-body"></div>
    </div>
  </div>

  <script src="/main.js" defer></script>
</body>
</html>
